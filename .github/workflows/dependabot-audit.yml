name: Dependabot Audit Log

on:
  pull_request:
    types: [closed]

jobs:
  log:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.user.login, 'dependabot')
    runs-on: ubuntu-latest
    steps:
      - name: Create audit issue for merged Dependabot PR
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.merged) return;
            const title = `Dependabot auto-merged PR #${pr.number}: ${pr.title}`;
            const body = `Merged PR: ${pr.html_url}\n\nMerge commit: ${pr.merge_commit_sha}\nAuthor: ${pr.user.login}\nMerged at: ${pr.merged_at}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['dependabot-audit']
            });
