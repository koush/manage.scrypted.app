appId: app.scrypted.manage
productName: Scrypted Operator Console
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
publish:
  - provider: github
    releaseType: draft
